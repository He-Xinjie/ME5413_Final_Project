DWAPlannerROS:
  # Robot Configuration
  acc_lim_x: 2.5
  acc_lim_y: 0.0
  acc_lim_theta: 3.2

  max_vel_x: 0.5
  min_vel_x: -0.2
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.5
  min_vel_trans: 0.1
  max_vel_theta: 1.5
  min_vel_theta: 0.0

  # Goal Tolerance
  yaw_goal_tolerance: 6.28
  xy_goal_tolerance: 0.5
  latch_xy_goal_tolerance: false

  # Forward Simulation
  sim_time: 2.0
  sim_granularity: 0.025
  vx_samples: 10
  vy_samples: 1
  vtheta_samples: 20
  controller_frequency: 10.0

  # Trajectory Scoring
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 1.0
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # Oscillation Prevention
  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.2

  # Global Plan
  prune_plan: true
